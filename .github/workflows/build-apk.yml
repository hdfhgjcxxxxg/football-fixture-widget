name: Build Verified APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FFW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/ffw-fixed-signing.jks"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/ffw-fixed-signing.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.FFW_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.FFW_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.FFW_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 20
          cp "$APK" FootballFixtureWidget.apk
          sha256sum FootballFixtureWidget.apk > FootballFixtureWidget.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootballFixtureWidget-verified-apk
          path: |
            FootballFixtureWidget.apk
            FootballFixtureWidget.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FootballFixtureWidget.apk FootballFixtureWidget.apk.sha256 --clobber
            gh release edit "$TAG" --title "MatchDay Widget v${VERSION_NAME}" --notes "自動ビルドされた署名済みAPKです。" --latest
          else
            gh release create "$TAG" FootballFixtureWidget.apk FootballFixtureWidget.apk.sha256 \
              --target "$GITHUB_SHA" --title "MatchDay Widget v${VERSION_NAME}" \
              --notes "自動ビルドされた署名済みAPKです。" --latest
          fi
