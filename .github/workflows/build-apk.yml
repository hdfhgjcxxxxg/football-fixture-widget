name: Build Verified APK + GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FFW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/ffw-fixed-signing.jks"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/ffw-fixed-signing.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.FFW_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.FFW_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.FFW_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== Android build diagnostics ==="
          if [ -f app/build/outputs/logs/manifest-merger-release-report.txt ]; then
            echo "=== manifest-merger-release-report.txt ==="
            cat app/build/outputs/logs/manifest-merger-release-report.txt
          fi
          find app/build -type f \
            \( -iname '*manifest*report*.txt' -o -iname '*manifest*log*.txt' \) \
            -print 2>/dev/null | while read -r f; do
              echo "=== $f ==="
              cat "$f" || true
            done

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 20
          cp "$APK" FootballFixtureWidget.apk
          sha256sum FootballFixtureWidget.apk > FootballFixtureWidget.apk.sha256

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootballFixtureWidget-verified-apk
          path: |
            FootballFixtureWidget.apk
            FootballFixtureWidget.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          SHA256="$(cut -d' ' -f1 FootballFixtureWidget.apk.sha256)"
          NOTES=$(cat <<EOF
          自動ビルドされた固定署名済みAPKです。

          - Version: ${VERSION_NAME}
          - Version code: ${VERSION_CODE}
          - Commit: ${GITHUB_SHA}
          - SHA-256: ${SHA256}
          EOF
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" FootballFixtureWidget.apk FootballFixtureWidget.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MatchDay Widget v${VERSION_NAME}" \
              --notes "$NOTES"
          else
            gh release create "$TAG" FootballFixtureWidget.apk FootballFixtureWidget.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MatchDay Widget v${VERSION_NAME}" \
              --notes "$NOTES"
          fi

          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f make_latest=true >/dev/null

      - name: Verify GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets,url \
            --jq '.assets[].name' | grep -Fx 'FootballFixtureWidget.apk'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'
