name: FootballFixtureWidgetiOS
options:
  bundleIdPrefix: com.hdfhgjcxxxxg
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FootballFixture:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdfhgjcxxxxg.footballfixturewidget.ios
        PRODUCT_NAME: FootballFixture
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Football Fixture
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: FootballFixtureWidgetExtension
        embed: true
  FootballFixtureWidgetExtension:
    type: app-extension
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdfhgjcxxxxg.footballfixturewidget.ios.widget
        PRODUCT_NAME: FootballFixtureWidgetExtension
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Football Fixture Widget
        SUPPORTS_MACCATALYST: NO
schemes:
  FootballFixture:
    build:
      targets:
        FootballFixture: all
        FootballFixtureWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
